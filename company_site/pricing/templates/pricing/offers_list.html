<!-- templates/pricing/offers_list.html -->

{% extends 'base.html' %}
{% load static %}

{% block title %}Offers - NetArch{% endblock %}

{% block content %}
<div class="container mt-4">
    <h1 class="mb-4">Offers & Pricing</h1>

    <!-- Offer List Display -->
    <div class="row">
        {% for offer in offers %}
            <div class="col-md-4 mb-4">
                <div class="card custom-card h-100">
                    <img class="card-img-top rounded" src="{{ offer.image.url }}">
                    <div class="card-body d-flex flex-column">
                        <h5 class="card-title mt-40">{{ offer.title }}</h5>
                        <p class="card-text">{{ offer.price_range }}</p>
                        <div class="btn-group mt-auto" role="group">
                            <a href="{% url 'pricing:offer_detail' offer.slug %}" class="btn btn-primary">Details</a>
                            <a href="{% url 'contact_form:contact' %}?offer_slug={{ offer.slug }}&requested_quote=1" class="btn btn-outline-primary">Quote</a>
                        </div>
                    </div>
                </div>
            </div>
        {% empty %}
            <p>No projects available.</p>
        {% endfor %}
    </div>
</div>
{% endblock %}
